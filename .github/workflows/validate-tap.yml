name: Validate tap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tap:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Update Homebrew
        run: brew update
      - name: Validate a fresh tap from this commit
        shell: bash
        run: |
          unset HOMEBREW_DEVELOPER
          brew developer off
          brew trust --tap "$GITHUB_WORKSPACE"
          brew tap bucketplace/platform "$GITHUB_WORKSPACE"
